function lsGetRaw(key){ try{ return localStorage.getItem(key)||""; }catch{ return ""; } }
function lsSetRaw(key,val){ try{ if(val) localStorage.setItem(key,val); else localStorage.removeItem(key); }catch{} }

(()=>{ const old=lsGetRaw(LS.GEMINI_KEY); if(old&&!Kit.settings.get().keys.gemini) Kit.settings.set({keys:{gemini:old}}); if(old) lsSetRaw(LS.GEMINI_KEY,""); })();
function lsGet(key){ return key===LS.GEMINI_KEY ? (Kit.settings.get().keys.gemini||"") : lsGetRaw(key); }
function lsSet(key,val){
  if(key===LS.GEMINI_KEY){ const v=val||""; if(v!==Kit.settings.get().keys.gemini) Kit.settings.set({keys:{gemini:v}}); return; }
  lsSetRaw(key,val);
}

const KR = {
  あ:"a",い:"i",う:"u",え:"e",お:"o",ア:"a",イ:"i",ウ:"u",エ:"e",オ:"o",
  か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",カ:"ka",キ:"ki",ク:"ku",ケ:"ke",コ:"ko",
  さ:"sa",し:"si",す:"su",せ:"se",そ:"so",サ:"sa",シ:"si",ス:"su",セ:"se",ソ:"so",
  た:"ta",ち:"ti",つ:"tu",て:"te",と:"to",タ:"ta",チ:"ti",ツ:"tu",テ:"te",ト:"to",
  な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",ナ:"na",ニ:"ni",ヌ:"nu",ネ:"ne",ノ:"no",
  は:"ha",ひ:"hi",ふ:"hu",へ:"he",ほ:"ho",ハ:"ha",ヒ:"hi",フ:"hu",ヘ:"he",ホ:"ho",
  ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",マ:"ma",ミ:"mi",ム:"mu",メ:"me",モ:"mo",
  や:"ya",ゆ:"yu",よ:"yo",ヤ:"ya",ユ:"yu",ヨ:"yo",
  ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",ラ:"ra",リ:"ri",ル:"ru",レ:"re",ロ:"ro",
  わ:"wa",を:"o",ん:"n",ワ:"wa",ヲ:"o",ン:"n",
  が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ガ:"ga",ギ:"gi",グ:"gu",ゲ:"ge",ゴ:"go",
  ざ:"za",じ:"zi",ず:"zu",ぜ:"ze",ぞ:"zo",ザ:"za",ジ:"zi",ズ:"zu",ゼ:"ze",ゾ:"zo",
  だ:"da",ぢ:"di",づ:"du",で:"de",ど:"do",ダ:"da",ヂ:"di",ヅ:"du",デ:"de",ド:"do",
  ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",バ:"ba",ビ:"bi",ブ:"bu",ベ:"be",ボ:"bo",
  ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",パ:"pa",ピ:"pi",プ:"pu",ペ:"pe",ポ:"po",
  きゃ:"kya",きゅ:"kyu",きょ:"kyo",しゃ:"sya",しゅ:"syu",しょ:"syo",
  ちゃ:"tya",ちゅ:"tyu",ちょ:"tyo",にゃ:"nya",にゅ:"nyu",にょ:"nyo",
  ひゃ:"hya",ひゅ:"hyu",ひょ:"hyo",みゃ:"mya",みゅ:"myu",みょ:"myo",
  りゃ:"rya",りゅ:"ryu",りょ:"ryo",ぎゃ:"gya",ぎゅ:"gyu",ぎょ:"gyo",
  じゃ:"zya",じゅ:"zyu",じょ:"zyo",びゃ:"bya",びゅ:"byu",びょ:"byo",
  ぴゃ:"pya",ぴゅ:"pyu",ぴょ:"pyo",
  キャ:"kya",キュ:"kyu",キョ:"kyo",シャ:"sya",シュ:"syu",ショ:"syo",
  チャ:"tya",チュ:"tyu",チョ:"tyo",ニャ:"nya",ニュ:"nyu",ニョ:"nyo",
  ヒャ:"hya",ヒュ:"hyu",ヒョ:"hyo",ミャ:"mya",ミュ:"myu",ミョ:"myo",
  リャ:"rya",リュ:"ryu",リョ:"ryo",ギャ:"gya",ギュ:"gyu",ギョ:"gyo",
  ジャ:"zya",ジュ:"zyu",ジョ:"zyo",ビャ:"bya",ビュ:"byu",ビョ:"byo",
  ピャ:"pya",ピュ:"pyu",ピョ:"pyo",
  ファ:"fa",フィ:"fi",フェ:"fe",フォ:"fo",ヴ:"vu",
};
function getVowels(r){
  const c=[...r];let res="",prev="",i=0;
  while(i<c.length){
    const ch=c[i];
    if(ch==="ー"||ch==="―"){res+=prev;i++;continue;}
    if(i+1<c.length){const t=ch+c[i+1];if(KR[t]){const v=KR[t].slice(-1);res+=v;prev=v;i+=2;continue;}}
    const rom=KR[ch];
    if(rom){if(rom==="n"){res+="n";prev="n";i++;continue;}const v=rom.slice(-1);res+=v;prev=v;}
    i++;
  }
  return res;
}
function isSameVowel(a,b){return getVowels(a)===getVowels(b);}
function countKana(r){
  const c=[...r];let cnt=0,i=0;
  while(i<c.length){
    const ch=c[i];
    if(ch==="ー"||ch==="―"){i++;continue;}
    if(i+1<c.length&&KR[ch+c[i+1]]){cnt++;i+=2;}
    else{if(KR[ch]||/[ぁ-んァ-ン]/.test(ch))cnt++;i++;}
  }
  return cnt;
}
function generateId(){return "w"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

const aiReady=()=>Kit.ai.current().ready;
async function callAI(prompt,maxTokens=2000){
  const r=await Kit.ai.ask({prompt,maxTokens});
  return r.text||"";
}
const parseAI=text=>Kit.ai.parseJson(text);

// 読み仮名だけから「代表的な単語と意味」をAIで取得
async function aiResolveReading(reading){
  const prompt=`「${reading}」という読み仮名で代表的な日本語単語を1つ答えてください。
出力形式（JSONのみ・余計な文章不要）:
{"word":"漢字表記","meaning":"30文字以内の意味説明"}`;
  try{
    const text=await callAI(prompt,200);
    const parsed=parseAI(text);
    return {word:parsed.word||reading, meaning:parsed.meaning||reading+"に関するもの"};
  }catch{
    return {word:reading, meaning:reading+"に関するもの"};
  }
}

async function aiGenerateHomovowels(targetReading,targetWord,existing,needed){
  const vp=getVowels(targetReading);
  const el=existing.map(e=>`${e.word}（${e.reading}）`).join("、");
  const prompt=`あなたは日本語の同母音異義語の専門家です。以下の条件で単語を${needed}個生成してください。
■母音パターン:${vp.toUpperCase()} ■お題単語:${targetWord}（${targetReading}）
■既存リスト（重複禁止）:${el||"なし"}
■同母音の定義:伸ばし棒（ー）は直前の母音を繰り返す。拗音は1音節（しゃ→ya）。
例:「登山」tozan→oan/「ロマン」roman→oan←同じ！
■必須:母音パターン完全一致・2〜6音節の実在する日本語・重複なし・意味30文字以内
■出力形式（JSONのみ。前置き・コードブロック不要）:
{"words":[{"word":"表記","reading":"よみがな","meaning":"説明"}],"exhausted":false}
これ以上存在しない場合:{"words":[],"exhausted":true}`;
  try{
    const text=await callAI(prompt,2000);
    return parseAI(text);
  }catch{return {words:[],exhausted:false};}
}

async function aiGenerateHint(answerWord,answerReading){
  const prompt=`単語「${answerWord}」（${answerReading}）の意味を、その単語自体や読み方を一切使わずに30文字以内で説明してください。意味の説明文のみ回答。`;
  try{const text=await callAI(prompt,200);return text.trim()||`${answerWord}に関するもの`;}
  catch{return `${answerWord}に関するもの`;}
}

function Btn({bg=C.yellow,fg=C.dark,sh=C.black,children,onClick,disabled,full,size="md"}){
  const [hov,setHov]=useState(false);
  const pad=size==="lg"?"15px 28px":size==="sm"?"7px 14px":"11px 22px";
  const fs=size==="lg"?"1.15rem":size==="sm"?"0.82rem":"0.95rem";
  return <button
    style={{background:bg,color:fg,border:`3px solid ${C.black}`,
      boxShadow:hov&&!disabled?`2px 2px 0 ${sh}`:`5px 5px 0 ${sh}`,
      transform:hov&&!disabled?"translate(3px,3px)":"none",
      padding:pad,fontSize:fs,fontWeight:"900",fontFamily:FM,
      cursor:disabled?"not-allowed":"pointer",borderRadius:"12px",
      letterSpacing:"0.05em",userSelect:"none",transition:"box-shadow .1s,transform .1s",
      opacity:disabled?0.45:1,width:full?"100%":"auto"}}
    onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
    onClick={!disabled?onClick:undefined}>{children}</button>;
}
function Card({bg=C.white,sh=C.black,children,style={}}){
  return <div style={{background:bg,color:bg===C.black?C.white:(bg===C.yellow?C.dark:C.black),borderRadius:"14px",
    border:`3px solid ${C.black}`,boxShadow:`8px 8px 0 ${sh}`,
    padding:"20px 22px",marginBottom:"16px",...style}}>{children}</div>;
}
function Lbl({children}){
  return <div style={{fontSize:"0.78rem",fontWeight:"900",
    letterSpacing:"0.1em",color:C.midGray,marginBottom:"6px"}}>{children}</div>;
}
function Tag({children,bg=C.yellow}){
  return <span style={{background:bg,color:bg===C.gray?C.black:C.dark,borderRadius:"999px",border:`2px solid ${C.black}`,
    padding:"2px 9px",fontSize:"0.75rem",fontWeight:"700",display:"inline-block"}}>{children}</span>;
}
const inp=(err=false)=>({background:C.white,color:C.black,
  border:`3px solid ${err?C.red:C.black}`,boxShadow:`4px 4px 0 ${err?C.red:C.yellow}`,
  padding:"10px 14px",fontSize:"1rem",fontFamily:FM,fontWeight:"700",borderRadius:"10px",outline:"none",width:"100%"});

// WordListScreen
// ═══════════════════════════════════════════════════════════════
function WordListScreen({db,sha,onSave,onBack}){
  const [words,setWords]=useState([...(db.words||[])]);
  const [kw,setKw]=useState(""); const [fChars,setFChars]=useState("all"); const [fVowel,setFVowel]=useState("");
  const [editId,setEditId]=useState(null); const [editData,setEditData]=useState({});
  const [saving,setSaving]=useState(false); const [saveMsg,setSaveMsg]=useState(null);
  const [addMode,setAddMode]=useState(false); const [nw,setNw]=useState({word:"",reading:"",meaning:""});

  const canWrite=true;

  const filtered=words.filter(w=>{
    const k=kw.trim().toLowerCase();
    const km=!k||w.word.includes(k)||w.reading.includes(k)||w.meaning.includes(k);
    const cm=fChars==="all"||String(countKana(w.reading))===fChars;
    const fv=fVowel.trim();
    const vm=!fv||getVowels(w.reading)===getVowels(fv)||getVowels(w.reading)===fv.toLowerCase();
    return km&&cm&&vm;
  });

  const startEdit=w=>{setEditId(w.id);setEditData({word:w.word,reading:w.reading,meaning:w.meaning});};
  const saveEdit=id=>{setWords(ws=>ws.map(w=>w.id===id?{...w,...editData,charCount:countKana(editData.reading)}:w));setEditId(null);};
  const deleteWord=id=>{if(window.confirm("この単語を削除しますか？"))setWords(ws=>ws.filter(w=>w.id!==id));};
  const addWord=()=>{
    if(!nw.word||!nw.reading||!nw.meaning)return;
    setWords(ws=>[...ws,{id:generateId(),...nw,charCount:countKana(nw.reading)}]);
    setNw({word:"",reading:"",meaning:""});setAddMode(false);
  };

  const handleSave=async()=>{
    setSaving(true);setSaveMsg(null);
    const newDb={...db,words,updatedAt:new Date().toISOString()};
    const {newSha,error}=await saveDB(newDb,sha);
    setSaving(false);
    if(error){
      setSaveMsg({ok:false,text:`✗ 保存失敗: ${error}`});
    }else{
      setSaveMsg({ok:true,text:"✓ 保存しました"});
      onSave(newDb,newSha||sha);
    }
    setTimeout(()=>setSaveMsg(null),4000);
  };

  const vowelMap={};
  words.forEach(w=>{const v=getVowels(w.reading);vowelMap[v]=(vowelMap[v]||0)+1;});
  const topVowels=Object.entries(vowelMap).sort((a,b)=>b[1]-a[1]).slice(0,10);

  return <div style={{minHeight:"100vh",background:"transparent",padding:"24px 16px"}}>
    <div style={{maxWidth:"780px",margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px",borderBottom:`3px solid ${C.black}`,paddingBottom:"16px",flexWrap:"wrap",gap:"10px"}}>
        <div>
          <div style={{fontFamily:FD,fontSize:"2.5rem",color:C.black}}>単語データベース</div>
          <div style={{color:C.midGray,fontSize:"0.8rem"}}>{words.length}語 登録済み
            
          </div>
        </div>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
          <Btn bg={canWrite?C.green:C.gray} fg={C.black} onClick={handleSave} disabled={saving||!canWrite}>
            {saving?"保存中...":"💾 保存"}
          </Btn>
          <Btn bg={C.gray} fg={C.black} onClick={onBack}>← 戻る</Btn>
        </div>
      </div>
      {saveMsg&&<div style={{background:saveMsg.ok?C.green:C.red,color:saveMsg.ok?C.black:C.white,border:`3px solid ${C.black}`,padding:"10px 16px",marginBottom:"14px",fontWeight:"700"}}>{saveMsg.text}</div>}

      <Card>
        <Lbl>◆ 検索・フィルター</Lbl>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:"10px"}}>
          <div><Lbl>キーワード</Lbl><input style={inp()} placeholder="単語・読み・意味" value={kw} onChange={e=>setKw(e.target.value)}/></div>
          <div><Lbl>文字数</Lbl>
            <select style={{...inp(),appearance:"none",cursor:"pointer"}} value={fChars} onChange={e=>setFChars(e.target.value)}>
              <option value="all">すべて</option>
              {[1,2,3,4,5,6].map(n=><option key={n} value={String(n)}>{n}文字</option>)}
            </select>
          </div>
          <div><Lbl>母音パターン（例: oan）</Lbl><input style={inp()} placeholder="母音列 or 読みがな" value={fVowel} onChange={e=>setFVowel(e.target.value)}/></div>
        </div>
        <div style={{marginTop:"8px",fontSize:"0.78rem",color:C.gray}}>{filtered.length}件 表示中</div>
      </Card>

      <Card>
        <Lbl>◆ 母音パターン別集計（クリックでフィルター）</Lbl>
        {topVowels.map(([v,cnt])=>(
          <div key={v} style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
            <button style={{background:"none",border:"none",cursor:"pointer",padding:0}} onClick={()=>setFVowel(v)}><Tag bg={C.yellow}>{v.toUpperCase()}</Tag></button>
            <div style={{flex:1,height:"12px",background:C.gray,border:`2px solid ${C.black}`,overflow:"hidden"}}>
              <div style={{width:`${Math.min(100,cnt/GENERATE_TARGET*100)}%`,height:"100%",background:cnt>=GENERATE_TARGET?C.green:C.yellow}}/>
            </div>
            <span style={{color:C.black,fontSize:"0.78rem",minWidth:"52px"}}>{cnt}/{GENERATE_TARGET}</span>
            {db.exhausted?.[v]&&<Tag bg={C.red}>上限</Tag>}
          </div>
        ))}
      </Card>

      <div style={{marginBottom:"14px"}}>
        {!addMode?<Btn bg={C.yellow} fg={C.black} onClick={()=>setAddMode(true)}>＋ 単語を追加</Btn>
        :<Card bg={C.white} sh={C.green}>
          <Lbl>◆ 新規単語追加</Lbl>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"10px"}}>
            <div><Lbl>単語</Lbl><input style={inp()} placeholder="例: 登山" value={nw.word} onChange={e=>setNw(p=>({...p,word:e.target.value}))}/></div>
            <div><Lbl>読み（仮名）</Lbl><input style={inp()} placeholder="例: とざん" value={nw.reading} onChange={e=>setNw(p=>({...p,reading:e.target.value}))}/></div>
          </div>
          <div style={{marginBottom:"10px"}}><Lbl>意味</Lbl><input style={inp()} placeholder="例: 山の頂上を目指す活動" value={nw.meaning} onChange={e=>setNw(p=>({...p,meaning:e.target.value}))}/></div>
          {nw.reading&&<div style={{marginBottom:"10px",display:"flex",gap:"8px",flexWrap:"wrap"}}><Tag>母音: {getVowels(nw.reading).toUpperCase()}</Tag><Tag bg={C.gray}>{countKana(nw.reading)}音節</Tag></div>}
          <div style={{display:"flex",gap:"8px"}}>
            <Btn bg={C.green} fg={C.black} onClick={addWord} disabled={!nw.word||!nw.reading||!nw.meaning}>追加</Btn>
            <Btn bg={C.gray} fg={C.black} onClick={()=>setAddMode(false)}>キャンセル</Btn>
          </div>
        </Card>}
      </div>

      {filtered.length===0&&<div style={{textAlign:"center",color:C.midGray,padding:"48px",border:`3px dashed ${C.midGray}`}}>該当する単語が見つかりません</div>}
      {filtered.map(w=>(
        <div key={w.id} className="fu" style={{background:C.white,border:`3px solid ${C.black}`,boxShadow:`4px 4px 0 ${C.yellow}`,padding:"14px 16px",marginBottom:"10px"}}>
          {editId===w.id
            ?<div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"8px"}}>
                <div><Lbl>単語</Lbl><input style={inp()} value={editData.word} onChange={e=>setEditData(p=>({...p,word:e.target.value}))}/></div>
                <div><Lbl>読み</Lbl><input style={inp()} value={editData.reading} onChange={e=>setEditData(p=>({...p,reading:e.target.value}))}/></div>
              </div>
              <div style={{marginBottom:"8px"}}><Lbl>意味</Lbl><input style={inp()} value={editData.meaning} onChange={e=>setEditData(p=>({...p,meaning:e.target.value}))}/></div>
              {editData.reading&&<div style={{marginBottom:"8px",display:"flex",gap:"8px"}}><Tag>母音: {getVowels(editData.reading).toUpperCase()}</Tag><Tag bg={C.gray}>{countKana(editData.reading)}音節</Tag></div>}
              <div style={{display:"flex",gap:"8px"}}>
                <Btn bg={C.green} fg={C.black} size="sm" onClick={()=>saveEdit(w.id)}>保存</Btn>
                <Btn bg={C.gray} fg={C.black} size="sm" onClick={()=>setEditId(null)}>キャンセル</Btn>
              </div>
            </div>
            :<div style={{display:"flex",gap:"12px",alignItems:"flex-start"}}>
              <div style={{flex:1}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"4px",flexWrap:"wrap"}}>
                  <span style={{fontFamily:FD,fontSize:"1.5rem"}}>{w.word}</span>
                  <span style={{fontSize:"0.85rem",color:C.midGray}}>（{w.reading}）</span>
                  <Tag bg={C.gray}>{countKana(w.reading)}文字</Tag>
                  <Tag>{getVowels(w.reading).toUpperCase()}</Tag>
                </div>
                <div style={{fontSize:"0.85rem",color:C.darkGray}}>{w.meaning}</div>
              </div>
              <div style={{display:"flex",gap:"6px",flexShrink:0}}>
                <Btn bg={C.blue} fg="#fff" size="sm" onClick={()=>startEdit(w)}>編集</Btn>
                <Btn bg={C.red} fg="#fff" size="sm" onClick={()=>deleteWord(w.id)}>削除</Btn>
              </div>
            </div>
          }
        </div>
      ))}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════
// TitleScreen
// ═══════════════════════════════════════════════════════════════
function TitleScreen({onStart,onWordList,db,sha,onDbUpdate}){
  // 初期の人数・名前はタイトル画面で決めたもの（1〜6人）
  // 人数・名前はタイトル画面の共通設定から（1〜6人）
  const rawParty=Math.round(+Kit.settings.get().partySize)||1;
  const players=Kit.players(Math.max(1,Math.min(6,rawParty))).map(name=>({name}));
  const [rounds,setRounds]=useState(3);
  const [topicReading,setTopicReading]=useState("");
  const [generating,setGenerating]=useState(false);
  const [genLog,setGenLog]=useState("");
  const [errors,setErrors]=useState({});

  const ai=Kit.ai.current();
  const geminiKey=ai.ready; // 旧名のまま：選択中のAIが使えるか

  // 入力がないときのランダムなお題（同じ母音の言葉が他にもある言葉を優先）
  const randomReading=()=>{
    const ws=db.words||[];
    const ok=ws.filter(w=>ws.some(x=>x.id!==w.id&&isSameVowel(x.reading,w.reading)&&!(x.reading===w.reading&&x.word===w.word)));
    const pool=ok.length?ok:ws;
    return pool.length?pool[Math.floor(Math.random()*pool.length)].reading:"";
  };

  const prepareAndStart=async()=>{
    let reading=topicReading.trim();
    if(!reading){ reading=randomReading(); if(!reading){Kit.toast("お題にできる言葉がありません");return;} setTopicReading(reading); Kit.SE.play("pop"); Kit.toast(`お題は「${reading}」`); }
    setErrors({});
    setGenerating(true);

    // 1. 読み仮名からAIで単語・意味を取得
    let topicWord=reading;
    let topicMeaning=reading+"に関するもの";
    const known=(db.words||[]).find(w=>w.reading===reading);
    if(known){ topicWord=known.word; topicMeaning=known.meaning; }
    else if(geminiKey){
      setGenLog("お題単語の情報をAIで生成中...");
      const resolved=await aiResolveReading(reading);
      topicWord=resolved.word;
      topicMeaning=resolved.meaning;
    }

    if(!geminiKey){const hit=(db.words||[]).find(w=>w.reading===reading);if(hit){topicWord=hit.word;topicMeaning=hit.meaning;}}
    let currentDb={...db,words:[...(db.words||[])],exhausted:{...(db.exhausted||{})}};
    const vowelPat=getVowels(reading);
    const alreadyIn=currentDb.words.find(w=>w.reading===reading&&w.word===topicWord);
    if(!alreadyIn) currentDb.words.push({id:generateId(),word:topicWord,reading:reading,meaning:topicMeaning,charCount:countKana(reading)});

    const existing=currentDb.words.filter(w=>isSameVowel(w.reading,reading)&&!(w.reading===reading&&w.word===topicWord));
    const isExhausted=!!currentDb.exhausted?.[vowelPat];
    const needMore=existing.length<GENERATE_TARGET&&!isExhausted;

    if(needMore){
      const needed=GENERATE_TARGET-existing.length;
      setGenLog(`同母音語を AI が生成中... (${needed}語追加予定)`);
      if(!geminiKey){
        setGenLog(`${ai.label}のAPIキー未設定 — 内蔵の言葉でゲームを開始します`);
        await new Promise(r=>setTimeout(r,600));
      }else{
        const result=await aiGenerateHomovowels(reading,topicWord,existing,needed);
        if(result.words?.length>0){
          result.words.forEach(w=>{
            if(!isSameVowel(w.reading,reading))return;
            if(!currentDb.words.find(x=>x.word===w.word&&x.reading===w.reading))
              currentDb.words.push({id:generateId(),word:w.word,reading:w.reading,meaning:w.meaning,charCount:countKana(w.reading)});
          });
          setGenLog(`${result.words.length}語追加しました`);
        }
        if(result.exhausted){currentDb.exhausted[vowelPat]=true;}
        currentDb.updatedAt=new Date().toISOString();
        const {newSha}=await saveDB(currentDb,sha);
        onDbUpdate(currentDb,newSha||sha);
      }
    }else{
      setGenLog(isExhausted?"上限記録済み — 既存データを使用":`DB内 ${existing.length}語 ✓`);
      await new Promise(r=>setTimeout(r,400));
    }

    const pool=currentDb.words.filter(w=>isSameVowel(w.reading,reading)&&!(w.reading===reading&&w.word===topicWord));
    setGenerating(false);
    onStart({players,rounds,topic:{word:topicWord,reading:reading,meaning:topicMeaning},pool});
  };

  const vowelPreview=topicReading?getVowels(topicReading):"";
  const dbCount=topicReading?(db.words||[]).filter(w=>isSameVowel(w.reading,topicReading)&&!(w.reading===topicReading&&w.word===topicReading)).length:0;
  const isExhausted=vowelPreview?!!db.exhausted?.[vowelPreview]:false;

  return <div style={{minHeight:"100vh",background:"transparent",padding:"32px 16px"}}>
    <div style={{textAlign:"center",marginBottom:"28px"}}>
      <div style={{fontFamily:FD,fontSize:"clamp(4rem,16vw,7rem)",color:C.black,lineHeight:1,textShadow:"4px 4px 0 var(--k-pink),7px 7px 0 var(--k-teal)"}}>同母音</div>
      <div style={{fontFamily:FD,fontSize:"clamp(1.2rem,4.5vw,2rem)",color:C.black,letterSpacing:"0.08em"}}>同母音異義語ゲーム</div>
      <div style={{display:"flex",gap:"8px",justifyContent:"center",marginTop:"10px",flexWrap:"wrap"}}>
        <Tag bg={geminiKey?C.green:C.red}>{geminiKey?`AI：${ai.label}（${ai.model}）`:`⚠ ${ai.label}のAPIキー未設定`}</Tag>
      </div>
    </div>

    <div style={{maxWidth:"600px",margin:"0 auto"}}>
      {/* お題 */}
      <Card bg={C.white} sh={C.red}>
        <Lbl>◆ お題の読み仮名（空のままならランダム）</Lbl>
        <input
          style={inp(errors.tr)}
          placeholder="例: とざん（空欄でスタートするとランダム）"
          value={topicReading}
          onChange={e=>setTopicReading(e.target.value)}
          onKeyDown={e=>e.key==="Enter"&&prepareAndStart()}
        />
        {topicReading&&<div style={{marginTop:"10px",display:"flex",gap:"8px",flexWrap:"wrap"}}>
          <Tag>母音: {vowelPreview.toUpperCase()}</Tag>
          <Tag bg={C.gray}>{countKana(topicReading)}音節</Tag>
          <Tag bg={dbCount>=GENERATE_TARGET?C.green:dbCount>0?C.yellow:C.gray}>
            DB: {dbCount}語{dbCount<GENERATE_TARGET&&!isExhausted?` → AI生成: ${GENERATE_TARGET-dbCount}語`:" ✓"}
          </Tag>
          {isExhausted&&<Tag bg={C.red}>上限記録済み</Tag>}
        </div>}
        <div style={{marginTop:"8px",fontSize:"0.75rem",color:C.midGray}}>
          {geminiKey?"漢字・意味・同じ母音の言葉はAIが用意します。読み仮名だけでOK":"APIキーがなくても、空欄でスタートすれば内蔵の言葉で遊べます"}
        </div>
      </Card>

      {/* ラウンド数 */}
      <Card>
        <Lbl>◆ ラウンド数: {rounds}回</Lbl>
        <input type="range" min="1" max="10" value={rounds} onChange={e=>setRounds(Number(e.target.value))} style={{width:"100%",accentColor:C.yellow,height:"8px"}}/>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:"0.72rem",marginTop:"4px",color:C.midGray}}>
          <span>1回</span><span style={{fontFamily:FD,fontSize:"1.6rem",color:C.red}}>{rounds}回</span><span>10回</span>
        </div>
      </Card>

      {/* プレイヤー（共通設定） */}
      <Card>
        <Lbl>◆ 参加（{players.length}人）</Lbl>
        <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
          {players.map((p,i)=><Tag key={i} bg={i===0?C.yellow:C.gray}>{p.name}</Tag>)}
        </div>
        <div style={{marginTop:"8px",fontSize:"0.75rem",color:C.midGray}}>
          {rawParty>6?`このゲームは1〜6人です。${players.length}人で遊びます。`:""}人数と名前はタイトルの「みんなで遊ぶ」で変えられます
        </div>
      </Card>

      {generating&&<div style={{background:C.white,border:`3px solid ${C.black}`,padding:"14px 18px",marginBottom:"14px"}} className="blink">
        <div style={{color:C.black,fontWeight:"700"}}>🤖 {genLog||"処理中..."}</div>
      </div>}

      <div style={{display:"flex",gap:"10px"}}>
        <div style={{flex:1}}><Btn bg={C.yellow} fg={C.black} sh={C.red} size="lg" full onClick={prepareAndStart} disabled={generating}>{generating?"準備中...":"ゲームスタート →"}</Btn></div>
        <Btn bg={C.blue} fg="#fff" size="lg" onClick={onWordList} title="単語リスト">📚</Btn>
      </div>
      <div style={{marginTop:"6px",fontSize:"0.72rem",color:C.midGray,textAlign:"right"}}>📚 単語リスト</div>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════
// GameScreen
// ═══════════════════════════════════════════════════════════════
function GameScreen({config,onFinish,resume}){
  const {players,rounds,topic,pool}=config;
  const isSingle=players.length===1;
  const R=resume&&resume.current?resume:null;
  const [round,setRound]=useState(R?R.round:0);
  const [scores,setScores]=useState(R?R.scores:Object.fromEntries(players.map(p=>[p.name,0])));
  const [phase,setPhase]=useState(R?(R.phase==="answer"?"question":R.phase):"loading");
  const [current,setCurrent]=useState(R?R.current:null);
  const [hint,setHint]=useState(R?R.hint:"");
  const [selPlayer,setSelPlayer]=useState(R?R.selPlayer:(isSingle?players[0].name:null));
  const [answer,setAnswer]=useState("");
  const [judgement,setJudgement]=useState(R?R.judgement:null);
  const [history,setHistory]=useState(R?R.history:[]);
  const [showVowels,setShowVowels]=useState(false);
  const usedIds=useRef(new Set(R?R.used:[]));

  // 進行状況をホームボタン用に公開
  useEffect(()=>{
    window.__hvSnap = phase==="loading"&&!current ? {screen:"game",config,game:null}
      : {screen:"game",config,game:{round,scores,phase,current,hint,selPlayer,judgement,history,used:[...usedIds.current]}};
  });

  const pickAnswer=()=>{
    const avail=pool.filter(w=>!usedIds.current.has(w.id));
    if(avail.length===0){usedIds.current.clear();return pool[Math.floor(Math.random()*pool.length)];}
    return avail[Math.floor(Math.random()*avail.length)];
  };

  const loadRound=async()=>{
    setPhase("loading");setJudgement(null);setAnswer("");setShowVowels(false);
    setSelPlayer(isSingle?players[0].name:null);
    if(pool.length===0){onFinish(scores,history);return;}
    const ans=pickAnswer();
    if(ans?.id)usedIds.current.add(ans.id);
    setCurrent(ans);
    const h=aiReady()?await aiGenerateHint(ans.word,ans.reading):ans.meaning;
    setHint(h);
    setPhase("question");
  };

  useEffect(()=>{ if(!R) loadRound(); },[]);

  const handleSubmit=()=>{
    if(!selPlayer||!answer.trim())return;
    const correct=answer.trim()===current.word||answer.trim()===current.reading;
    if(correct)setScores(s=>({...s,[selPlayer]:s[selPlayer]+1}));
    setJudgement(correct?"correct":"wrong");
    if(correct) Kit.celebrate({title:"正解!",sub:`${current.word}（${current.reading}）`,ms:1500});
    else Kit.fail({title:"ざんねん",sub:`正解は ${current.word}`,ms:1300});
    setHistory(h=>[...h,{round:round+1,player:selPlayer,topicWord:topic.word,topicReading:topic.reading,answer:current.word,answerReading:current.reading,userInput:answer.trim(),correct}]);
    setPhase("result");
  };

  const handleNext=()=>{
    const next=round+1;
    if(next>=rounds)onFinish(scores,history);
    else{setRound(next);loadRound();}
  };

  const vQ=getVowels(topic.reading);
  const vA=current?getVowels(current.reading):"";

  return <div style={{minHeight:"100vh",background:"transparent",padding:"24px 16px"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"18px",borderBottom:`3px solid ${C.black}`,paddingBottom:"14px"}}>
      <div style={{fontFamily:FD,fontSize:"2rem",color:C.black}}>同母音ゲーム</div>
      <Tag bg={C.red}>ラウンド {round+1} / {rounds}</Tag>
    </div>

    <div style={{display:"flex",gap:"8px",marginBottom:"18px",overflowX:"auto",paddingBottom:"4px"}}>
      {players.map(p=>(
        <div key={p.name} style={{background:C.white,border:`3px solid ${C.black}`,padding:"8px 12px",boxShadow:`4px 4px 0 ${C.yellow}`,textAlign:"center",minWidth:"86px",flexShrink:0}}>
          <div style={{fontSize:"0.7rem",fontWeight:"700",color:C.midGray,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",maxWidth:"76px"}}>{p.name}</div>
          <div style={{fontFamily:FD,fontSize:"2.2rem",color:C.black}}>{scores[p.name]}</div>
        </div>
      ))}
    </div>

    {phase==="loading"&&<div style={{background:C.white,border:`3px solid ${C.black}`,padding:"48px",textAlign:"center"}} className="blink">
      <div style={{fontFamily:FD,fontSize:"2rem",color:C.black}}>AI がヒントを生成中...</div>
    </div>}

    {(phase==="question"||phase==="answer"||phase==="result")&&current&&<div className="fu">
      <Card>
        <Lbl>◆ お題単語</Lbl>
        <div style={{display:"flex",gap:"16px",alignItems:"center",flexWrap:"wrap"}}>
          <div>
            <div style={{fontFamily:FD,fontSize:"3rem",lineHeight:1}}>{topic.word}</div>
            <div style={{fontSize:"0.85rem",color:C.midGray}}>（{topic.reading}）</div>
          </div>
          <div style={{background:C.black,color:C.white,padding:"8px 14px",border:`2px solid ${C.black}`,fontSize:"0.85rem",flex:1}}>{topic.meaning}</div>
        </div>
        <div style={{marginTop:"12px",display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
          <Btn bg={C.gray} fg={C.black} size="sm" onClick={()=>setShowVowels(v=>!v)}>{showVowels?"母音を隠す":"母音を表示"}</Btn>
          {showVowels&&<Tag>{vQ.toUpperCase()}</Tag>}
        </div>
      </Card>

      <div style={{background:C.yellow,color:C.dark,borderRadius:"14px",border:`3px solid ${C.black}`,boxShadow:`6px 6px 0 ${C.black}`,padding:"22px",marginBottom:"16px"}}>
        <Lbl>◆ ヒント — 同じ母音を持つ別の言葉とは？</Lbl>
        <div style={{fontFamily:FD,fontSize:"clamp(1.5rem,4vw,2rem)",letterSpacing:"0.03em"}}>{hint}</div>
      </div>

      {phase==="question"&&<Btn bg={C.white} fg={C.black} sh={C.red} size="lg" full onClick={()=>setPhase("answer")}>回答する →</Btn>}

      {phase==="answer"&&<Card className="fu">
        <Lbl>◆ 回答入力</Lbl>
        {!isSingle&&<div style={{marginBottom:"14px"}}>
          <Lbl>回答するプレイヤーを選択</Lbl>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            {players.map(p=><Btn key={p.name} bg={selPlayer===p.name?C.blue:C.gray} fg={selPlayer===p.name?C.white:C.black} onClick={()=>setSelPlayer(p.name)}>{p.name}</Btn>)}
          </div>
        </div>}
        <input style={inp()} placeholder="答えを入力（ひらがな・カタカナ・漢字OK）" value={answer} onChange={e=>setAnswer(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()} autoFocus/>
        <div style={{marginTop:"12px"}}><Btn bg={C.yellow} fg={C.black} size="lg" full onClick={handleSubmit} disabled={!selPlayer||!answer.trim()}>判定！</Btn></div>
      </Card>}

      {phase==="result"&&judgement&&<div style={{background:judgement==="correct"?C.yellow:C.red,color:judgement==="correct"?C.dark:"#fff",borderRadius:"14px",border:`3px solid ${C.black}`,boxShadow:`8px 8px 0 ${C.black}`,padding:"22px",marginBottom:"16px"}} className="fu">
        <div style={{fontFamily:FD,fontSize:"3.5rem",lineHeight:0.9,marginBottom:"10px"}}>{judgement==="correct"?"正解！":"ざんねん…"}</div>
        {!isSingle&&<div style={{fontWeight:"700",marginBottom:"8px"}}>回答者: {selPlayer}</div>}
        <div style={{background:C.black,color:C.white,padding:"14px 16px"}}>
          <div style={{fontSize:"0.72rem",color:C.gray,marginBottom:"4px"}}>正解</div>
          <div style={{fontFamily:FD,fontSize:"2.5rem"}}>{current.word}</div>
          <div style={{fontSize:"0.85rem",color:C.gray}}>（{current.reading}）</div>
          <div style={{fontSize:"0.9rem",marginTop:"4px"}}>{current.meaning}</div>
          <div style={{marginTop:"10px"}}><Tag>母音: {vA.toUpperCase()} = {vQ.toUpperCase()}</Tag></div>
        </div>
        <div style={{marginTop:"16px"}}>
          <Btn bg={C.black} fg={C.yellow} size="lg" full onClick={handleNext}>{round+1>=rounds?"結果を見る 🏆":`次のラウンドへ (${round+2}/${rounds})`}</Btn>
        </div>
      </div>}
    </div>}
  </div>;
}

// ═══════════════════════════════════════════════════════════════
// ResultScreen
// ═══════════════════════════════════════════════════════════════
function ResultScreen({scores,history,players,config,onRestart}){
  const sorted=[...players].sort((a,b)=>(scores[b.name]||0)-(scores[a.name]||0));
  const top=scores[sorted[0].name];
  const winners=sorted.filter(p=>scores[p.name]===top);
  const medals=["🥇","🥈","🥉"];
  // 成績：表示時に1回だけ全員分を記録（結果画面はセーブされないので再開で二重記録しない）
  useEffect(()=>{
    const rounds=(config&&config.rounds)||history.length||1;
    const detail=`${rounds}ラウンド${config&&config.topic?`・お題:${config.topic.word}`:""}`;
    const group=Kit.newGroup();
    players.forEach(p=>{
      const sc=scores[p.name]||0;
      const result=players.length===1 ? (sc*2>rounds?"clear":"fail") : (winners.length===players.length?"play":(sc===top?"win":"lose"));
      Kit.record({game:HV_ID,player:p.name,result,score:sc,detail,group});
    });
  },[]);
  useEffect(()=>{ Kit.celebrate({title:winners.length===1?"優勝!":"引き分け!",sub:`${winners.map(w=>w.name).join("・")} ${top}点`}); },[]);
  return <div style={{minHeight:"100vh",background:"transparent",padding:"32px 16px"}}>
    <div style={{maxWidth:"640px",margin:"0 auto"}} className="fu">
      <div style={{textAlign:"center",marginBottom:"28px"}}>
        <div style={{fontFamily:FD,fontSize:"clamp(3rem,12vw,5rem)",color:C.black,lineHeight:1}}>けっか</div>
        <div style={{marginTop:"12px"}}>
          {winners.length===1?<Tag bg={C.yellow}>🏆 {winners[0].name} の勝利！ {top}点</Tag>
          :<Tag bg={C.yellow}>🤝 引き分け！ {winners.map(w=>w.name).join(" & ")} {top}点</Tag>}
        </div>
      </div>
      <Card>
        <Lbl>◆ 最終スコア</Lbl>
        {sorted.map((p,i)=>(
          <div key={p.name} style={{display:"flex",alignItems:"center",gap:"12px",padding:"12px",background:i===0?C.yellow:C.gray,color:i===0?C.dark:C.black,borderRadius:"10px",border:`2px solid ${C.black}`,marginBottom:"8px"}}>
            <div style={{fontFamily:FD,fontSize:"2rem",minWidth:"36px"}}>{medals[i]||`${i+1}`}</div>
            <div style={{flex:1,fontWeight:"700"}}>{p.name}</div>
            <div style={{fontFamily:FD,fontSize:"2.8rem"}}>{scores[p.name]||0}</div>
            <div style={{fontSize:"0.8rem"}}>点</div>
          </div>
        ))}
      </Card>
      <Card>
        <Lbl>◆ ラウンド履歴</Lbl>
        {history.map((r,i)=>(
          <div key={i} style={{background:r.correct?"color-mix(in srgb,var(--k-teal) 22%,var(--k-label))":"color-mix(in srgb,var(--k-pink) 18%,var(--k-label))",borderRadius:"10px",border:`2px solid ${C.black}`,padding:"10px 14px",marginBottom:"8px",fontSize:"0.85rem"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:"4px",flexWrap:"wrap",gap:"4px"}}>
              <span style={{fontWeight:"700"}}>R{r.round}</span>
              <span style={{color:C.darkGray}}>{r.player}</span>
              <span style={{fontWeight:"700"}}>{r.correct?"✓ 正解":"✗ 不正解"}</span>
            </div>
            <div>お題: <strong>{r.topicWord}</strong> → 正解: <strong>{r.answer}</strong>（{r.answerReading}）</div>
            <div style={{color:C.darkGray}}>あなたの回答: {r.userInput}</div>
          </div>
        ))}
      </Card>
      <Btn bg={C.yellow} fg={C.black} sh={C.red} size="lg" full onClick={onRestart}>もう一度プレイ →</Btn>
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════════
// App
// ═══════════════════════════════════════════════════════════════
function App(){
  const saved=useRef(Kit.load(HV_ID));
  const [screen,setScreen]=useState("loading");
  const [db,setDb]=useState(null);
  const [sha,setSha]=useState(null);
  const [gameConfig,setGameConfig]=useState(null);
  const [finalScores,setFinalScores]=useState(null);
  const [finalHistory,setFinalHistory]=useState(null);

  useEffect(()=>{
    (async()=>{
      const {db:d,sha:s}=await fetchDB();
      setDb(d||JSON.parse(JSON.stringify(FALLBACK_DB)));
      if(s)setSha(s);
      const sv=saved.current;
      if(sv&&sv.screen==="game"&&sv.config){ setGameConfig(sv.config); setScreen("game"); Kit.toast("つづきから再開します"); }
      else setScreen("title");
    })();
  },[]);

  const handleDbUpdate=(newDb,newSha)=>{setDb(newDb);if(newSha)setSha(newSha);};
  const handleStart=config=>{saved.current=null;setGameConfig(config);setScreen("game");Kit.SE.play("start");};
  const handleFinish=(scores,history)=>{saved.current=null;window.__hvSnap=null;Kit.clearSave(HV_ID);setFinalScores(scores);setFinalHistory(history);setScreen("result");};
  useEffect(()=>{ if(screen!=="game") window.__hvSnap=null; },[screen]);
  const handleRestart=()=>{setGameConfig(null);setFinalScores(null);setFinalHistory(null);setScreen("title");};
  const handleWordListSave=(newDb,newSha)=>{setDb(newDb);if(newSha)setSha(newSha);};

  if(screen==="loading"||!db) return <div style={{minHeight:"100vh",background:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{textAlign:"center"}} className="blink">
      <div style={{fontFamily:FD,fontSize:"5rem",color:C.black}}>同母音</div>
      <div style={{color:C.midGray,marginTop:"8px",fontSize:"0.9rem"}}>準備中...</div>
    </div>
  </div>;

  if(screen==="wordlist") return <WordListScreen db={db} sha={sha} onSave={handleWordListSave} onBack={()=>setScreen("title")}/>;
  if(screen==="title")    return <TitleScreen onStart={handleStart} onWordList={()=>setScreen("wordlist")} db={db} sha={sha} onDbUpdate={handleDbUpdate}/>;
  if(screen==="game")     return <GameScreen config={gameConfig} onFinish={handleFinish} resume={saved.current&&saved.current.game}/>;
  if(screen==="result")   return <ResultScreen scores={finalScores} history={finalHistory} players={gameConfig.players} config={gameConfig} onRestart={handleRestart}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
