<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>無言トーク | あそびばこ</title>
<meta name="description" content="言葉を発さずにエピソードトークを伝えるパーティゲーム">
<link rel="stylesheet" href="../../kit/kit.css">
<style>
:root{
  --paper:var(--k-label2); --paper2:var(--k-label2); --card:var(--k-label); --ink:var(--k-ink); --ink2:var(--k-ink2); --line:var(--k-ink);
  --accent:var(--k-pink); --accent-ink:#fff; --gold:var(--k-yellow);
  --adj:#f08a24; --verb:var(--k-teal); --noun:var(--k-blue); --conj:#9b4f9e;
  --shadow:var(--k-shadow); --r:var(--k-r);
}
*{box-sizing:border-box}
html,body{margin:0}
body{line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 64px}
header.title{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.logo{width:58px;height:58px;flex:none}
h1{font-family:var(--k-display);font-size:clamp(28px,7vw,44px);margin:0;letter-spacing:.08em;line-height:1.1}
h1 small{display:block;font-size:13px;letter-spacing:.04em;color:var(--ink2);font-weight:700;margin-top:4px}
.theme-btn{margin-left:auto;white-space:nowrap;flex:none;background:none;border:2px solid var(--line);border-radius:999px;color:var(--ink);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}

.panel{margin-top:6px;background:var(--card);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 20px;position:relative}
.panel-tag{position:absolute;top:-14px;left:14px;background:var(--ink);color:var(--paper);font-weight:900;font-size:13px;padding:2px 12px;border-radius:999px;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

button{font:inherit;cursor:pointer}
.btn{font-family:var(--k-body);border:3px solid var(--line);border-radius:12px;background:var(--paper2);color:var(--ink);font-weight:900;padding:10px 16px;box-shadow:3px 3px 0 var(--line);transition:transform .08s, box-shadow .08s;letter-spacing:.04em}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);color:#1d2440}
.btn.big{font-size:clamp(16px,4.6vw,20px);white-space:nowrap;padding:14px 18px;width:100%}
.btn.sm{font-size:13px;padding:6px 10px;box-shadow:2px 2px 0 var(--line)}
.btn.ghost{background:transparent}

/* Episode */
.ep-title{font-family:var(--k-display);font-size:22px;margin:6px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ep-title .no{font-size:13px;color:var(--ink2)}
.parts{display:grid;gap:10px}
.part{display:grid;grid-template-columns:1fr 112px;gap:10px;align-items:stretch}
.part-text{border:2px dashed color-mix(in srgb,var(--ink) 35%,transparent);border-radius:10px;padding:10px 12px;background:var(--paper)}
.part-label{display:inline-block;font-weight:900;font-size:12px;background:var(--ink);color:var(--paper);padding:0 8px;border-radius:6px;margin-right:6px;letter-spacing:.06em}
.part-text p{margin:4px 0 0;font-size:16px}
.part-text mark{background:none;color:inherit;border-bottom:3px solid var(--mk,var(--accent));font-weight:700;padding:0 1px}
.hidden-text .part-text p{filter:blur(7px);user-select:none}
.meter{border:2px solid var(--line);border-radius:10px;background:var(--paper2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;gap:4px;transition:opacity .2s}
.meter.off{opacity:.45}
.meter .val{font-family:var(--k-display);font-size:24px;line-height:1}
.meter .val small{font-size:12px}
.meter .cap{font-size:11px;color:var(--ink2);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;border:2px solid var(--line);background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--card) var(--p,0%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--gold);border:2.5px solid var(--line);cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--gold);border:2.5px solid var(--line);cursor:pointer}
input[type=range]:disabled{cursor:not-allowed}
.placeholder{color:var(--ink2);text-align:center;padding:26px 8px;border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:10px}
.placeholder b{display:block;font-family:var(--k-display);font-size:20px;color:var(--ink);margin-bottom:4px}

.custom{margin-top:14px;border-top:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);padding-top:12px}
.custom[hidden]{display:none}
label.lbl{font-weight:900;font-size:13px;display:block;margin:8px 0 4px}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{min-height:100px;resize:vertical}
.hint{font-size:12px;color:var(--ink2);margin:4px 0 0}
.msg{font-size:14px;font-weight:700;margin-top:8px}
.msg.err{color:var(--accent)}
details.api{margin-top:10px;border:2px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper)}
details.api summary{font-weight:900;cursor:pointer}

/* Elements */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;margin-bottom:10px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--line);vertical-align:-1px;margin-right:4px}
.counter{margin-left:auto;font-weight:900;color:var(--ink)}
.cat{margin:8px 0}
.cat h3{margin:0 0 6px;font-size:13px;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:var(--ink);border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;box-shadow:2px 2px 0 var(--line);position:relative}
.chip::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:1px;border:1.5px solid var(--line)}
.chip.on{background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.chip.on::before{background:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.chip[data-cat=adj]{--c:var(--adj)} .chip[data-cat=verb]{--c:var(--verb)} .chip[data-cat=noun]{--c:var(--noun)} .chip[data-cat=conj]{--c:var(--conj)}
.play-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.pcard{--c:var(--ink);border:3px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);padding:16px 10px 12px;text-align:center;font-size:clamp(20px,5.5vw,28px);font-weight:900;color:var(--ink);border-top:12px solid var(--c);transition:transform .1s}
.pcard small{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-top:4px}
.pcard.speaking{transform:scale(1.05) rotate(-1deg);background:color-mix(in srgb,var(--c) 18%,var(--card))}
.pcard[data-cat=adj]{--c:var(--adj)} .pcard[data-cat=verb]{--c:var(--verb)} .pcard[data-cat=noun]{--c:var(--noun)} .pcard[data-cat=conj]{--c:var(--conj)}

/* Game controls */
.timer-box{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--k-display);font-size:28px;font-variant-numeric:tabular-nums}
.ring.warn .t{color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.status{font-weight:900;font-size:18px}
.status small{display:block;font-weight:400;font-size:13px;color:var(--ink2)}
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{margin-top:14px;text-align:center;border:3px double var(--line);border-radius:12px;padding:14px;background:var(--paper)}
.result[hidden]{display:none}
.result .score{font-family:var(--k-display);font-size:56px;line-height:1;color:var(--accent)}
.result .score small{font-size:20px;color:var(--ink)}
.result .rank{font-weight:900;margin-top:6px}

/* Log */
.log-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.log-item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.log-item .no{font-weight:900;text-align:center;color:var(--ink2)}
.log-item input{padding:4px 8px;font-size:15px;font-weight:700}
.log-item .meta{font-size:12px;color:var(--ink2);margin-top:2px}
.log-item .sc{font-family:var(--k-display);font-size:26px;color:var(--accent);white-space:nowrap}
.log-item .sc small{font-size:12px;color:var(--ink)}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:10px}

@media (max-width:560px){
  .part{grid-template-columns:1fr 86px}
  .meter .val{font-size:20px}
  .ring{width:96px;height:96px}
  .ring .t{font-size:23px}
}
footer{text-align:center;font-size:12px;color:var(--ink2);margin-top:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body class="kit">
<div class="wrap">

  <!-- 1. エピソード -->
  <section class="panel" id="episodePanel" aria-labelledby="epTag">
    <span class="panel-tag" id="epTag">エピソード</span>
    <div class="row" id="epButtons" style="margin-top:6px">
      <button class="btn primary" id="btnRandom" type="button">🎲 エピソードを出力</button>
      <button class="btn" id="btnCustom" type="button">✏️ 自分で記入</button>
      <button class="btn sm ghost" id="btnHide" type="button" hidden style="margin-left:auto">🙈 本文を隠す</button>
    </div>

    <div class="custom" id="customBox" hidden>
      <label class="lbl" for="customText">エピソードを三行で書いてください（1行目＝導入／2行目＝展開／3行目＝結論。各1文・20〜30字くらいが目安）</label>
      <textarea id="customText" placeholder="例）&#10;寝ぼけたまま、歯みがき粉を歯ブラシにのせた。&#10;ところが、みがくと味がおかしくて首をかしげた。&#10;よく見ると、それは洗顔フォームだった。"></textarea>
      <details class="api" id="apiDetails">
        <summary>🔑 AIの設定</summary>
        <p class="hint" id="keyState"></p>
        <p class="hint">AIはタイトルの「設定変更」で選んだもの（Claude / Gemini とモデル名）を使います。</p>
      </details>
      <div class="row" style="margin-top:10px">
        <button class="btn gold" id="btnExtract" type="button">✨ トーク要素を抜き出す</button>
        <button class="btn sm ghost" id="btnCancelCustom" type="button">閉じる</button>
      </div>
      <div class="msg" id="customMsg" role="status"></div>
    </div>

    <div id="episodeView" style="margin-top:14px">
      <div class="placeholder"><b>まだエピソードがありません</b>「エピソードを出力」か「自分で記入」を押してください。</div>
    </div>
  </section>

  <!-- 2. 要素選択 -->
  <section class="panel" id="elementPanel" aria-labelledby="elTag">
    <span class="panel-tag" id="elTag">トーク要素</span>
    <div class="legend" style="margin-top:6px">
      <span><i style="background:var(--adj)"></i>形容詞</span>
      <span><i style="background:var(--verb)"></i>動詞</span>
      <span><i style="background:var(--noun)"></i>名称</span>
      <span><i style="background:var(--conj)"></i>接続語</span>
      <span class="counter" id="counter">0 / 4</span>
    </div>
    <div id="elementView"><div class="empty">エピソードを選ぶと、ここにトーク要素が並びます。</div></div>
  </section>

  <!-- 3. ゲーム操作 -->
  <section class="panel" id="gamePanel" aria-labelledby="gmTag">
    <span class="panel-tag" id="gmTag">ゲーム</span>
    <div class="timer-box" style="margin-top:6px">
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="50" fill="none" stroke="var(--paper2)" stroke-width="12"/>
          <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="0"/>
          <circle cx="60" cy="60" r="56" fill="none" stroke="var(--line)" stroke-width="2.5"/>
          <circle cx="60" cy="60" r="44" fill="none" stroke="var(--line)" stroke-width="2.5"/>
        </svg>
        <div class="t" id="timerText" aria-live="off">3:00</div>
      </div>
      <div class="status" id="statusText">準備中<small>要素を1つ以上選ぶとスタートできます</small></div>
    </div>
    <button class="btn primary big" id="btnStart" type="button" disabled>▶ ゲームスタート</button>
    <div class="ctrl-grid" id="playCtrls" hidden>
      <button class="btn big" id="btnStop" type="button">⏸ ストップ</button>
      <button class="btn gold big" id="btnGot" type="button">🙌 伝わった！</button>
    </div>
    <div class="result" id="resultBox" hidden>
      <div class="hint">再現度の平均（導入・展開・結論）</div>
      <div class="score" id="scoreText">0<small> 点</small></div>
      <div class="rank" id="rankText"></div>
    </div>
  </section>

  <!-- 4. やり直し -->
  <section class="panel" aria-label="やり直し" style="padding:14px">
    <button class="btn big" id="btnRetry" type="button">↺ やり直し</button>
    <p class="hint" style="text-align:center;margin-top:6px">エピソードを再抽選して、要素を選び直します</p>
  </section>

  <!-- 5. 点数ログ -->
  <section class="panel" id="logPanel" aria-labelledby="lgTag">
    <span class="panel-tag" id="lgTag">点数ログ</span>
    <label class="lbl" for="playerName" style="margin-top:6px">今回話す人の名前</label>
    <div class="k-seg" id="nameChips" role="group" aria-label="話す人を選ぶ" style="margin-bottom:8px"></div>
    <input type="text" id="playerName" maxlength="20" placeholder="例）こじま">
    <p class="hint">ログに残った名前はあとから書き換えられます。</p>
    <ol class="log-list" id="logList"></ol>
    <div class="row" style="margin-top:10px;justify-content:flex-end">
      <button class="btn sm ghost" id="btnClearLog" type="button">ログを消去</button>
    </div>
  </section>

  <footer>無言トーク — 声は出さずに、身ぶり・表情・動きだけで。</footer>
</div>

<script src="../../kit/kit.js"></script>
<script src="episodes.js"></script>
<script>
(() => {
'use strict';
const TIME_LIMIT = 180;           // 秒
const MAX_PICK = 4;
const CATS = [
  {key:'adj',  label:'形容詞'},
  {key:'verb', label:'動詞'},
  {key:'noun', label:'名称'},
  {key:'conj', label:'接続語'},
];
const PARTS = [
  {key:'intro', label:'導入'},
  {key:'development', label:'展開'},
  {key:'conclusion', label:'結論'},
];
const EPISODES = Array.isArray(window.EPISODES) ? window.EPISODES : [];
const ID = 'mugon-talk';
const $ = id => document.getElementById(id);

// ---------- storage (safe) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

// ---------- state ----------
const S = {
  episode: null,        // {id,title,parts,elements,custom?}
  selected: [],         // [{cat,text}]
  phase: 'idle',        // idle | playing | paused | done
  remaining: TIME_LIMIT,
  endAt: 0,
  tick: null,
  scores: [0,0,0],
  hideText: false,
  lastId: null,
  log: store.get('mugon.log', []),
  lastSec: -1,
};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function fmtTime(sec){ const c = Math.max(0, Math.ceil(sec)); return `${Math.floor(c/60)}:${String(c%60).padStart(2,'0')}`; }

// ---------- episode ----------
function pickRandom(){
  if(!EPISODES.length){ return; }
  let ep;
  do { ep = EPISODES[Math.floor(Math.random()*EPISODES.length)]; }
  while(EPISODES.length > 1 && ep.id === S.lastId);
  S.lastId = ep.id;
  setEpisode(ep);
}
function setEpisode(ep){
  resetGame();
  S.episode = ep;
  S.selected = [];
  renderAll();
}

function highlight(text){
  const sel = S.selected.slice().sort((a,b)=>b.text.length-a.text.length);
  if(!sel.length) return esc(text);
  const colorOf = {}; sel.forEach(s=>{ if(!(s.text in colorOf)) colorOf[s.text] = `var(--${s.cat})`; });
  const re = new RegExp(sel.map(s=>reEsc(s.text)).join('|'), 'g');
  let out = '', last = 0, m;
  while((m = re.exec(text))){
    if(!m[0]){ re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + `<mark style="--mk:${colorOf[m[0]]}">${esc(m[0])}</mark>`;
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function renderEpisode(){
  const v = $('episodeView');
  const ep = S.episode;
  if(!ep){
    v.innerHTML = '<div class="placeholder"><b>まだエピソードがありません</b>「エピソードを出力」か「自分で記入」を押してください。</div>';
    $('btnHide').hidden = true;
    return;
  }
  const active = S.phase === 'playing' || S.phase === 'paused';
  const no = ep.custom ? 'オリジナル' : `No.${String(ep.id).padStart(2,'0')}`;
  v.innerHTML = `
    <div class="ep-title"><span>${esc(ep.title)}</span><span class="no">${no}</span></div>
    <div class="parts ${S.hideText ? 'hidden-text' : ''}">
      ${PARTS.map((p,i)=>`
        <div class="part">
          <div class="part-text"><span class="part-label">${p.label}</span><p>${highlight(ep.parts[p.key]||'')}</p></div>
          <div class="meter ${active ? '' : 'off'}">
            <span class="cap">再現度</span>
            <span class="val"><span id="mv${i}">${S.scores[i]}</span><small>点</small></span>
            <input type="range" min="0" max="100" step="5" value="${S.scores[i]}" data-i="${i}" ${active?'':'disabled'}
              aria-label="${p.label}の再現度" style="--p:${S.scores[i]}%">
          </div>
        </div>`).join('')}
    </div>`;
  v.querySelectorAll('input[type=range]').forEach(r => r.addEventListener('input', e => {
    const i = +e.target.dataset.i, val = +e.target.value;
    S.scores[i] = val;
    e.target.style.setProperty('--p', val+'%');
    $('mv'+i).textContent = val;
  }));
  $('btnHide').hidden = !active;
  $('btnHide').textContent = S.hideText ? '👀 本文を表示' : '🙈 本文を隠す';
}

// ---------- elements ----------
const isSel = (cat,text) => S.selected.some(s=>s.cat===cat && s.text===text);
function renderElements(){
  const v = $('elementView');
  const ep = S.episode;
  $('counter').textContent = `${S.selected.length} / ${MAX_PICK}`;
  if(!ep){ v.innerHTML = '<div class="empty">エピソードを選ぶと、ここにトーク要素が並びます。</div>'; return; }

  if(S.phase === 'playing' || S.phase === 'paused' || S.phase === 'done'){
    v.innerHTML = `<p class="hint" style="margin:0 0 10px">カードをタップすると読み上げます 🔊</p>
      <div class="play-cards">${S.selected.map((s,i)=>`
        <button class="pcard" type="button" data-cat="${s.cat}" data-i="${i}">${esc(s.text)}<small>${CATS.find(c=>c.key===s.cat).label}</small></button>`).join('')}
      </div>`;
    v.querySelectorAll('.pcard').forEach(b => b.addEventListener('click', () => speak(S.selected[+b.dataset.i].text, b)));
    return;
  }
  const full = S.selected.length >= MAX_PICK;
  v.innerHTML = CATS.map(c => {
    const list = (ep.elements[c.key]||[]);
    if(!list.length) return '';
    return `<div class="cat"><h3>${c.label}</h3><div class="chips">${
      list.map(t => { const on = isSel(c.key,t);
        return `<button type="button" class="chip ${on?'on':''}" data-cat="${c.key}" data-t="${esc(t)}" aria-pressed="${on}" ${(!on && full)?'disabled':''}>${esc(t)}</button>`;
      }).join('')}</div></div>`;
  }).join('');
  v.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => toggle(b.dataset.cat, b.dataset.t)));
}
function toggle(cat, text){
  if(S.phase !== 'idle') return;
  const i = S.selected.findIndex(s=>s.cat===cat && s.text===text);
  if(i >= 0) S.selected.splice(i,1);
  else if(S.selected.length < MAX_PICK) S.selected.push({cat,text});
  renderAll();
}

// ---------- speech ----------
let jaVoice = null;
function loadVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v=>/ja[-_]JP/i.test(v.lang)) || vs.find(v=>/^ja/i.test(v.lang)) || null;
}
if('speechSynthesis' in window){ loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function speak(text, el){
  if(!('speechSynthesis' in window)){ flashStatus('この端末は読み上げに対応していません'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; if(jaVoice) u.voice = jaVoice; u.rate = 0.9;
  if(el){ el.classList.add('speaking'); const off = () => el.classList.remove('speaking'); u.onend = off; u.onerror = off; setTimeout(off, 2500); }
  speechSynthesis.speak(u);
}

// ---------- timer / game ----------
const ARC = 2*Math.PI*50;
function drawTimer(){
  $('timerText').textContent = fmtTime(S.remaining);
  $('ringArc').style.strokeDashoffset = (ARC * (1 - S.remaining/TIME_LIMIT)).toFixed(2);
  $('ring').classList.toggle('warn', S.phase === 'playing' && S.remaining <= 30 && S.remaining > 0);
}
function startGame(){
  if(!S.episode || !S.selected.length || S.phase !== 'idle') return;
  Kit.SE.play('start');
  S.phase = 'playing'; S.scores = [0,0,0]; S.remaining = TIME_LIMIT;
  runClock();
  renderAll();
}
function runClock(){
  S.endAt = performance.now() + S.remaining*1000;
  clearInterval(S.tick);
  S.tick = setInterval(() => {
    S.remaining = Math.max(0, (S.endAt - performance.now())/1000);
    drawTimer();
    const sec = Math.ceil(S.remaining);
    if(sec !== S.lastSec){ S.lastSec = sec; if(sec <= 10 && sec > 0) Kit.SE.play(sec <= 5 ? 'count' : 'tick'); }
    if(S.remaining <= 0) finish();
  }, 200);
}
function togglePause(){
  if(S.phase === 'playing'){
    clearInterval(S.tick);
    S.remaining = Math.max(0, (S.endAt - performance.now())/1000);
    S.phase = 'paused';
  } else if(S.phase === 'paused'){
    S.phase = 'playing';
    runClock();
  }
  renderControls(); drawTimer();
}
function finish(){
  if(S.phase !== 'playing' && S.phase !== 'paused') return;
  clearInterval(S.tick);
  S.remaining = 0; S.phase = 'done';
  const avg = Math.round(S.scores.reduce((a,b)=>a+b,0) / S.scores.length);
  const name = ($('playerName').value || '').trim() || 'ななしさん';
  S.log.unshift({
    name, score: avg, parts: S.scores.slice(),
    title: S.episode.title, elements: S.selected.map(s=>s.text),
    at: new Date().toISOString(),
  });
  S.log = S.log.slice(0, 100);
  store.set('mugon.log', S.log);
  $('scoreText').innerHTML = `${avg}<small> 点</small>`;
  $('rankText').textContent = rank(avg);
  renderAll();
  Kit.clearSave(ID);
  Kit.record({ game: ID, player: name, result: avg >= 50 ? 'clear' : 'fail', score: avg, detail: S.episode.title });
  if(avg >= 50) Kit.celebrate({ title: avg >= 90 ? '以心伝心!' : '伝わった!', sub: `${name} ${avg}点` });
  else Kit.fail({ title: avg >= 30 ? 'なんとなく…' : '伝わらず', sub: `${name} ${avg}点` });
}
function rank(n){
  if(n >= 90) return '🏆 以心伝心！ほぼ完全再現';
  if(n >= 70) return '🎉 ばっちり伝わった！';
  if(n >= 50) return '👍 だいたい伝わった';
  if(n >= 30) return '🤔 なんとなく伝わった…かも';
  return '😶 沈黙が深すぎた';
}
function resetGame(){
  clearInterval(S.tick);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  S.phase = 'idle'; S.remaining = TIME_LIMIT; S.scores = [0,0,0]; S.hideText = false;
}
let statusTimer = null;
function flashStatus(text){
  const el = $('statusText');
  el.innerHTML = esc(text); clearTimeout(statusTimer);
  statusTimer = setTimeout(renderControls, 2200);
}
function renderControls(){
  const p = S.phase;
  $('btnStart').hidden = (p === 'playing' || p === 'paused');
  $('btnStart').disabled = !(S.episode && S.selected.length >= 1 && p === 'idle');
  $('btnStart').textContent = p === 'done' ? '▶ ゲームスタート（やり直しで次へ）' : '▶ ゲームスタート';
  $('playCtrls').hidden = !(p === 'playing' || p === 'paused');
  $('btnStop').textContent = p === 'paused' ? '▶ 再開' : '⏸ ストップ';
  $('resultBox').hidden = p !== 'done';
  ['btnRandom','btnCustom','btnExtract'].forEach(id => $(id).disabled = (p === 'playing' || p === 'paused'));
  const st = $('statusText');
  if(p === 'idle'){
    st.innerHTML = !S.episode ? '準備中<small>まずエピソードを用意しましょう</small>'
      : S.selected.length ? `準備OK<small>${S.selected.length}個の要素を選択中。スタートで3分カウント開始</small>`
      : '要素を選ぼう<small>要素を1つ以上（最大4つ）選ぶとスタートできます</small>';
  } else if(p === 'playing'){
    st.innerHTML = '🤐 無言で伝え中…<small>聞き手は右のバーで再現度を採点</small>';
  } else if(p === 'paused'){
    st.innerHTML = '⏸ 一時停止中<small>もう一度押すと再開します</small>';
  } else {
    st.innerHTML = 'タイムアップ！<small>スコアを点数ログに記録しました</small>';
  }
  drawTimer();
}

// ---------- log ----------
function renderLog(){
  const ul = $('logList');
  if(!S.log.length){ ul.innerHTML = '<li class="empty">まだ記録がありません</li>'; return; }
  ul.innerHTML = S.log.map((r,i) => {
    const d = new Date(r.at);
    const when = isNaN(d) ? '' : `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<li class="log-item">
      <span class="no">${S.log.length - i}</span>
      <div><input type="text" value="${esc(r.name)}" data-i="${i}" maxlength="20" aria-label="記録${S.log.length - i}の名前">
        <div class="meta">${esc(r.title)} ／ ${esc((r.elements||[]).join('・'))}${when ? ' ／ '+when : ''}${r.parts ? ` ／ 導${r.parts[0]}・展${r.parts[1]}・結${r.parts[2]}` : ''}</div></div>
      <span class="sc">${r.score}<small>点</small></span>
    </li>`;
  }).join('');
  ul.querySelectorAll('input').forEach(inp => inp.addEventListener('change', e => {
    const i = +e.target.dataset.i; S.log[i].name = e.target.value.trim() || 'ななしさん';
    store.set('mugon.log', S.log);
  }));
}

function renderAll(){ renderEpisode(); renderElements(); renderControls(); renderLog(); }

// ---------- custom episode via AI（Claude / Gemini） ----------

// APIキーは共通設定（Kit.settings keys.claude）を使う。旧 mugon.apikey は共通設定が空のときだけ移行
(() => {
  const old = store.get('mugon.apikey', '');
  if(old && !Kit.settings.get().keys.claude) Kit.settings.set({ keys:{ claude: old } });
  if(old) store.del('mugon.apikey');
})();
// APIキーはタイトルの「設定変更」で入れたものを使う（このゲームに入力欄はない）
const drawKeyState = () => { const c = Kit.ai.current(); $('keyState').textContent = c.ready
  ? `使うAI：${c.label}（${c.model}）`
  : `使うAI（${c.label}）のAPIキーが未設定です。タイトルの「設定変更」で入れると使えます。`; };
drawKeyState();


function setMsg(t, err){ const m = $('customMsg'); m.textContent = t; m.classList.toggle('err', !!err); }

async function extract(){
  const lines = $('customText').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(lines.length !== 3){ setMsg(`エピソードは三行で書いてください（いま${lines.length}行）。`, true); return; }
  if(!Kit.ai.current().ready){ $('apiDetails').open = true; drawKeyState(); setMsg(`使うAI（${Kit.ai.current().label}）のAPIキーが未設定です。タイトルの「設定変更」で入れてください。`, true); return; }

  const btn = $('btnExtract'); btn.disabled = true; setMsg(`⏳ ${Kit.ai.current().label} がトーク要素を抜き出しています…`);
  const system = 'あなたは日本語の品詞分析アシスタントです。与えられた三部構成のエピソードから、パーティゲームで使う「トーク要素」を抜き出し、指定のJSONのみを出力します。前置きや説明、コードブロックは書きません。';
  const prompt = `次の短いエピソード（導入・展開・結論、各1文）からトーク要素を抜き出してください。

導入: ${lines[0]}
展開: ${lines[1]}
結論: ${lines[2]}

ルール:
- adj: 形容詞・形容動詞（2〜3個）
- verb: 動詞（2〜3個）
- noun: 名称（名詞・物の名前。身ぶりで表せる具体的な物を優先）（3〜4個）
- conj: 接続語（接続詞・接続表現。例: だから、しかし、ところが、すると）（0〜2個。本文に無ければ空配列）
- すべての要素は本文に書かれている文字列そのまま（部分文字列）にすること。活用形も本文どおり。
- 同じ要素を重複させない。1要素は1〜8文字程度。
- title: エピソードを表す12文字以内のタイトル

出力形式（このJSONのみ）:
{"title":"...","elements":{"adj":[],"verb":[],"noun":[],"conj":[]}}`;

  try{
    const json = (await Kit.ai.ask({ system, prompt, json: true, maxTokens: 1024 })).json || {};
    const body = lines.join('');
    const elements = {};
    let total = 0;
    CATS.forEach(c => {
      const seen = new Set();
      elements[c.key] = (Array.isArray(json.elements && json.elements[c.key]) ? json.elements[c.key] : [])
        .map(s => String(s).trim()).filter(s => s && body.includes(s) && !seen.has(s) && seen.add(s));
      total += elements[c.key].length;
    });
    if(!total) throw new Error('本文に含まれる要素を抜き出せませんでした。文章を変えて試してください。');
    const title = String(json.title || 'わたしのエピソード').slice(0, 12);
    setEpisode({ id: 0, custom: true, title, parts:{intro:lines[0], development:lines[1], conclusion:lines[2]}, elements });
    setMsg(`✅ ${total}個のトーク要素を抜き出しました。下の欄から選んでください。`);
  }catch(err){
    const m = (err && err.message) || '不明なエラーが発生しました。';
    setMsg(m, true);
  }finally{
    btn.disabled = (S.phase === 'playing' || S.phase === 'paused');
  }
}

// ---------- events ----------
$('btnRandom').addEventListener('click', () => { $('customBox').hidden = true; pickRandom(); });
$('btnCustom').addEventListener('click', () => { $('customBox').hidden = false; setMsg(''); $('customText').focus(); });
$('btnCancelCustom').addEventListener('click', () => { $('customBox').hidden = true; });
$('btnExtract').addEventListener('click', extract);
$('btnStart').addEventListener('click', startGame);
$('btnStop').addEventListener('click', togglePause);
$('btnGot').addEventListener('click', finish);
$('btnHide').addEventListener('click', () => { S.hideText = !S.hideText; renderEpisode(); });
$('btnRetry').addEventListener('click', async () => {
  if((S.phase === 'playing' || S.phase === 'paused') && !await Kit.confirm('進行中のゲームを中断してやり直しますか？\n（スコアは記録されません）', {ok:'やり直す', danger:true})) return;
  $('customBox').hidden = true;
  if(EPISODES.length) pickRandom();
  else if(S.episode){ setEpisode(S.episode); }
});
$('btnClearLog').addEventListener('click', async () => {
  if(!S.log.length || !await Kit.confirm('点数ログをすべて消去しますか？', {ok:'消去', danger:true})) return;
  S.log = []; store.set('mugon.log', S.log); renderLog();
});
// 話す人：初期値は基本プレイヤー名。上のチップ（タイトルで決めた人数ぶん）からも選べる
function renderNameChips(){
  const cur = ($('playerName').value || '').trim();
  $('nameChips').innerHTML = Kit.players(Math.max(2, Kit.settings.get().partySize || 2))
    .map(n => `<button type="button" data-se="select" data-n="${esc(n)}" aria-pressed="${n === cur}">${esc(n)}</button>`).join('');
}
$('playerName').value = Kit.mainName();
$('playerName').addEventListener('input', renderNameChips);
$('nameChips').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  $('playerName').value = b.dataset.n; renderNameChips();
});



// ---------- セーブ / 再開 ----------
Kit.mount({ id: ID, title: '無言トーク', onSave: () => {
  if(!S.episode || S.phase === 'done') return null;
  if(S.phase === 'playing'){ clearInterval(S.tick); S.remaining = Math.max(0,(S.endAt - performance.now())/1000); S.phase = 'paused'; renderControls(); }
  return { episode:S.episode, selected:S.selected, phase:S.phase, remaining:S.remaining, scores:S.scores, hideText:S.hideText, lastId:S.lastId, name:$('playerName').value };
}});
const saved = Kit.load(ID);
if(saved && saved.episode){
  Object.assign(S, { episode:saved.episode, selected:saved.selected||[], phase:saved.phase||'idle', remaining:saved.remaining ?? TIME_LIMIT,
    scores:saved.scores||[0,0,0], hideText:!!saved.hideText, lastId:saved.lastId });
  if(saved.name) $('playerName').value = saved.name;
}
renderNameChips();
if(saved && saved.episode){
  Kit.toast(S.phase === 'paused' ? '一時停止中から再開できます' : 'つづきから再開します');
}
renderAll();
if(!EPISODES.length) $('episodeView').innerHTML = '<div class="placeholder"><b>episodes.js が読み込めませんでした</b>index.html と同じフォルダに episodes.js を置いてください。「自分で記入」は使えます。</div>';
})();
</script>
