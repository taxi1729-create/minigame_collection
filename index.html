<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6b58a">
<title>あそびばこ</title>
<meta name="description" content="すぐ遊べる単発ミニゲーム集">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='18' width='52' height='40' rx='6' fill='%23d6b58a' stroke='%231d2440' stroke-width='5'/%3E%3Cpath d='M4 18h56l-6-10H10z' fill='%23ff4fa3' stroke='%231d2440' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="kit/kit.css">
<style>
.hub-top{display:flex;justify-content:flex-end;padding:12px 16px 0;padding-top:max(12px,env(safe-area-inset-top))}
/* ---- 箱のふた（タイトル） ---- */
.lid{margin:18px auto 34px;max-width:520px;position:relative;text-align:center;padding:0 16px}
.lid__box{
  position:relative;background:var(--k-label);border:4px solid var(--k-ink);border-radius:18px;
  box-shadow:6px 6px 0 var(--k-ink);padding:26px 16px 22px;transform:rotate(-1.2deg);
}
.lid__box::before,.lid__box::after{ /* ふたの留めテープ */
  content:"";position:absolute;top:-14px;width:70px;height:26px;background:color-mix(in srgb,var(--k-teal) 70%,transparent);
  border:2px solid color-mix(in srgb,var(--k-ink) 30%,transparent);
}
.lid__box::before{left:18px;transform:rotate(-8deg)}
.lid__box::after{right:18px;transform:rotate(6deg);background:color-mix(in srgb,var(--k-pink) 65%,transparent)}
.logo{
  font-family:var(--k-display);font-size:clamp(44px,14.5vw,96px);line-height:1;margin:0;letter-spacing:0;white-space:nowrap;
  color:var(--k-ink);
  text-shadow:4px 4px 0 var(--k-pink), 7px 7px 0 var(--k-teal);
}
.logo span{display:inline-block;animation:hop .6s cubic-bezier(.2,1.6,.4,1) both}
.logo span:nth-child(2){animation-delay:.06s}.logo span:nth-child(3){animation-delay:.12s}
.logo span:nth-child(4){animation-delay:.18s}.logo span:nth-child(5){animation-delay:.24s}
@keyframes hop{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.lid__sub{margin:10px 0 0;font-weight:900;font-size:15px;color:var(--k-ink2)}
.lid__note{display:inline-block;margin-top:12px;font-size:13px;font-weight:900;background:var(--k-yellow);color:#1d2440;border:2px solid var(--k-ink);border-radius:999px;padding:1px 12px;transform:rotate(1.5deg)}

/* ---- 棚 ---- */
.shelf{max-width:760px;margin:0 auto;padding:0 16px 22px}
.shelf h2{display:flex;align-items:center;gap:10px;font-family:var(--k-display);font-weight:400;font-size:20px;margin:6px 0 14px}
.shelf h2::after{content:"";flex:1;height:0;border-top:3px dashed color-mix(in srgb,var(--k-ink) 45%,transparent)}
.shelf h2 small{font-family:var(--k-body);font-weight:900;font-size:13px;color:var(--k-ink2)}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

/* ---- チケット ---- */
.ticket{
  --c:var(--k-pink);
  position:relative;display:grid;grid-template-columns:76px 1fr;text-align:left;
  background:var(--k-label);border:3px solid var(--k-ink);border-radius:14px;box-shadow:var(--k-shadow);
  padding:0;min-height:104px;overflow:visible;
  transition:transform .1s, box-shadow .1s;
}
.ticket:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--k-ink)}
.ticket__stub{
  background:var(--c);border-right:3px dashed var(--k-ink);border-radius:11px 0 0 11px;
  display:flex;align-items:center;justify-content:center;color:#1d2440;
}
.ticket__stub svg{width:46px;height:46px}
.ticket::before,.ticket::after{ /* もぎり穴 */
  content:"";position:absolute;left:62px;width:24px;height:24px;border-radius:50%;
  background:var(--k-board);border:3px solid var(--k-ink);
}
.ticket::before{top:-14px;clip-path:inset(50% 0 0 0)}
.ticket::after{bottom:-14px;clip-path:inset(0 0 50% 0)}
.ticket__body{padding:12px 14px 12px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.ticket__name{font-family:var(--k-display);font-size:20px;line-height:1.25}
.ticket__desc{font-size:13px;color:var(--k-ink2);line-height:1.55}
.ticket__meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.ticket__save{
  position:absolute;top:-10px;right:10px;transform:rotate(6deg);
  font-family:var(--k-display);font-size:13px;color:#fff;background:var(--k-pink);
  border:2.5px solid var(--k-ink);border-radius:8px;padding:0 8px;box-shadow:2px 2px 0 var(--k-ink);
}
.c-pink{--c:var(--k-pink)}.c-teal{--c:var(--k-teal)}.c-yellow{--c:var(--k-yellow)}.c-blue{--c:#8fb3ff}

/* ---- 詳細シート ---- */
.sheet h3{font-family:var(--k-display);font-weight:400;font-size:26px;margin:0 0 6px}
.sheet .how{margin:10px 0 16px;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.sheet .how li{padding-left:22px;position:relative}
.sheet .how li::before{content:"";position:absolute;left:4px;top:.6em;width:9px;height:9px;border-radius:50%;background:var(--sc,var(--k-pink));border:2px solid var(--k-ink)}
.sheet .savenote{font-size:13px;font-weight:900;color:var(--k-pink);margin:0 0 10px}
footer.hub-foot{text-align:center;color:var(--k-ink2);font-size:12px;padding:10px 16px 40px}
</style>
</head>
<body class="kit">
<div class="hub-top"><button class="k-iconbtn k-sound" id="snd" type="button" data-se="none" aria-label="効果音のオンオフ"></button></div>

<header class="lid">
  <div class="lid__box">
    <h1 class="logo" aria-label="あそびばこ"><span>あ</span><span>そ</span><span>び</span><span>ば</span><span>こ</span></h1>
    <p class="lid__sub">ふたを開けたら、すぐあそべる<br>単発ミニゲーム集</p>
    <span class="lid__note">途中でホームに戻っても、つづきから</span>
  </div>
</header>

<main id="shelves"></main>
<footer class="hub-foot">あそびばこ ／ 効果音は右上でオンオフできます</footer>

<div class="k-modal" id="sheet" hidden>
  <div class="k-panel sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle"></h3>
    <div class="k-row" id="sheetMeta"></div>
    <ul class="how" id="sheetHow"></ul>
    <p class="savenote" id="sheetSave" hidden></p>
    <div class="k-stack" id="sheetBtns"></div>
  </div>
</div>

<script src="kit/kit.js"></script>
<script>
(() => {
'use strict';
const ICONS = {
  aimai:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h22a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6H18l-7 6v-6H8z" fill="#fffdf7"/><path d="M17 17.5a4 4 0 1 1 5 3.9c-1 .3-1.5 1-1.5 2v.6"/><circle cx="20.5" cy="27" r=".8" fill="currentColor"/><path d="M34 22h4a4 4 0 0 1 4 4v4a4 4 0 0 1-4 4h-1v4l-5-4" fill="#fffdf7"/></svg>',
  mugon:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="9" width="34" height="24" rx="8" fill="#fffdf7"/><path d="M15 33l-3 7 9-7"/><circle cx="17" cy="19" r="2" fill="currentColor"/><circle cx="31" cy="19" r="2" fill="currentColor"/><path d="M18 26h12M21 24l-1.5 4M25 24l-1.5 4M29 24l-1.5 4"/></svg>',
  ishu:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="24" r="5" fill="#fffdf7"/><circle cx="37" cy="24" r="5" fill="#fffdf7"/><path d="M17 20c4-5 10-5 14 0"/><path d="M28 18l3 2-1 3.5"/><path d="M17 30l3 3 3-4 3 4 3-3 2 2"/></svg>',
  homo:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="12" width="17" height="24" rx="4" fill="#fffdf7"/><rect x="26" y="12" width="17" height="24" rx="4" fill="#fffdf7"/><path d="M10 28l3.5-10 3.5 10M11.2 24.5h4.6"/><path d="M31 28l3.5-10 3.5 10M32.2 24.5h4.6"/><path d="M22 6l2 4 2-4"/></svg>',
  pita:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="27" r="14" fill="#fffdf7"/><path d="M20 7h8M24 7v6M36 15l3-3"/><path d="M24 27V19"/><path d="M24 27l6 4"/></svg>',
  iro:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="36" height="22" rx="5" fill="#fffdf7"/><text x="24" y="25" text-anchor="middle" font-size="14" font-weight="900" fill="#3a6fe0" stroke="none" font-family="sans-serif">あか</text><circle cx="13" cy="38" r="4" fill="#ff4fa3"/><circle cx="24" cy="38" r="4" fill="#00a3a1"/><circle cx="35" cy="38" r="4" fill="#3a6fe0"/></svg>',
  slide:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><rect x="6" y="6" width="36" height="36" rx="5" fill="#fffdf7"/><rect x="10" y="10" width="12" height="12" rx="2" fill="#ff4fa3"/><rect x="26" y="10" width="12" height="12" rx="2" fill="#00a3a1"/><rect x="10" y="26" width="12" height="12" rx="2" fill="#3a6fe0"/><path d="M28 32h8M33 29l3 3-3 3" stroke-linecap="round"/></svg>',
};
const GAMES = [
  {id:'aimai-answer', icon:'aimai', color:'c-pink', group:'party', name:'あいまいアンサー', players:'3〜8人',
   desc:'伝えすぎたら0点。ちょうどいい「あいまい」なヒントで一部の人だけに当てさせよう。',
   how:['出題者だけがお題を見て、ひとことヒントを出す','ほかの人は答えを考えて、正解した人をチェック','一部だけ正解なら出題者に高得点。全員正解・全員不正解は0点']},
  {id:'mugon-talk', icon:'mugon', color:'c-teal', group:'party', name:'無言トーク', players:'2人〜',
   desc:'しゃべらずに、エピソードを伝えきれ。身ぶりと表情だけで3分勝負。',
   how:['エピソードとトーク要素（最大4つ）を選ぶ','話し手は声を出さずに3分で伝える','聞き手が導入・展開・結論の再現度を採点']},
  {id:'ishu-dengon', icon:'ishu', color:'c-yellow', group:'party', name:'異種伝言ゲーム', players:'2〜7人',
   desc:'絵・ジェスチャー・1秒トーク…人ごとに違う方法で伝える伝言ゲーム。お題は伝わるたびに修飾語が増えていく。',
   how:['人数と難易度を決めてスタート','順番にスマホを回し、毎回ちがうアクションで伝える','最後の人が答えを入力して判定']},
  {id:'homovowel', icon:'homo', color:'c-blue', group:'party', name:'同母音異義語ゲーム', players:'1〜6人',
   desc:'「とざん」と「ロマン」は母音が同じ。ヒントから同じ母音の言葉を当てよう。',
   how:['お題の読みがなを入れる（おまかせもOK）','ヒントを見て、同じ母音の言葉を答える','ラウンドを重ねて得点を競う']},
  {id:'pitatto', icon:'pita', color:'c-pink', group:'solo', name:'ピタッと10秒', players:'1人',
   desc:'途中から見えなくなるストップウォッチを、ちょうど10.00秒で止める。',
   how:['スタートを押したら心の中でカウント','3秒たつと表示が消える','ストップで誤差を判定。±0.10秒以内でクリア']},
  {id:'irokotoba', icon:'iro', color:'c-teal', group:'solo', name:'いろことば', players:'1人',
   desc:'文字の意味ではなく「インクの色」をタップ。30秒で何問とけるか。',
   how:['表示された文字の色を下のボタンから選ぶ','正解でコンボ、まちがえるとコンボが切れる','30秒で20点以上ならクリア']},
  {id:'slide-puzzle', icon:'slide', color:'c-yellow', group:'solo', name:'すべらせパズル', players:'1人',
   desc:'数字のタイルをすべらせて、1から順に並べる定番パズル。',
   how:['空いたマスのとなりのタイルをタップで移動','3×3と4×4から選べる','少ない手数でそろえて記録更新']},
];
const GROUPS = [{key:'party', label:'みんなで', note:'スマホ1台を回して遊ぶ'},{key:'solo', label:'ひとりで', note:'すきま時間に'}];

function ago(ts){
  const m = Math.round((Date.now()-ts)/60000);
  if(m < 1) return 'たった今'; if(m < 60) return m+'分前';
  const h = Math.round(m/60); if(h < 24) return h+'時間前';
  return Math.round(h/24)+'日前';
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function render(){
  document.getElementById('shelves').innerHTML = GROUPS.map(g => `
    <section class="shelf" aria-labelledby="g-${g.key}">
      <h2 id="g-${g.key}">${g.label}<small>${g.note}</small></h2>
      <div class="tickets">${GAMES.filter(x=>x.group===g.key).map(x => {
        const sv = Kit.saveInfo(x.id);
        return `<button class="ticket ${x.color}" type="button" data-id="${x.id}" data-se="select">
          <span class="ticket__stub" aria-hidden="true">${ICONS[x.icon]}</span>
          <span class="ticket__body">
            <span class="ticket__name">${esc(x.name)}</span>
            <span class="ticket__desc">${esc(x.desc)}</span>
            <span class="ticket__meta"><span class="k-chip">${x.players}</span>${bestChip(x.id)}</span>
          </span>
          ${sv ? '<span class="ticket__save">つづきあり</span>' : ''}
        </button>`;
      }).join('')}</div>
    </section>`).join('');
  document.querySelectorAll('.ticket').forEach(t => t.addEventListener('click', () => openSheet(t.dataset.id)));
}
function bestChip(id){
  const b = Kit.best(id);
  if(b == null) return '';
  const label = {pitatto: v => `ベスト 誤差${v.toFixed(2)}秒`, irokotoba: v => `ベスト ${v}点`, 'slide-puzzle': v => `ベスト ${v}手`}[id];
  return label ? `<span class="k-chip k-chip--yellow">${label(b)}</span>` : '';
}

const sheet = document.getElementById('sheet');
function openSheet(id){
  const g = GAMES.find(x => x.id === id);
  const sv = Kit.saveInfo(id);
  const href = `games/${id}/index.html`;
  document.getElementById('sheetTitle').textContent = g.name;
  document.getElementById('sheetMeta').innerHTML = `<span class="k-chip">${g.players}</span>`;
  const how = document.getElementById('sheetHow');
  how.style.setProperty('--sc', getComputedStyle(document.querySelector(`[data-id="${id}"] .ticket__stub`)).backgroundColor);
  how.innerHTML = g.how.map(h => `<li>${esc(h)}</li>`).join('');
  const sn = document.getElementById('sheetSave');
  sn.hidden = !sv; if(sv) sn.textContent = `${ago(sv.at)}のセーブがあります`;
  const btns = document.getElementById('sheetBtns');
  btns.innerHTML = sv
    ? `<button class="k-btn k-btn--primary k-btn--big k-btn--block" data-act="cont" data-se="start">つづきから</button>
       <button class="k-btn k-btn--block" data-act="new">はじめから</button>`
    : `<button class="k-btn k-btn--primary k-btn--big k-btn--block" data-act="new" data-se="start">あそぶ</button>`;
  btns.insertAdjacentHTML('beforeend', '<button class="k-btn k-btn--ghost k-btn--block" data-act="close">とじる</button>');
  btns.onclick = async e => {
    const a = e.target.closest('[data-act]'); if(!a) return;
    if(a.dataset.act === 'close'){ sheet.hidden = true; return; }
    if(a.dataset.act === 'new' && sv){
      if(!await Kit.confirm('セーブを消して、はじめから遊びますか？', {ok:'はじめから', danger:true})) return;
      Kit.clearSave(id); Kit.SE.play('start');
    }
    setTimeout(() => location.href = href, 180);
  };
  sheet.hidden = false;
  btns.querySelector('button').focus();
}
sheet.addEventListener('click', e => { if(e.target === sheet) sheet.hidden = true; });
document.addEventListener('keydown', e => { if(e.key === 'Escape') sheet.hidden = true; });

const snd = document.getElementById('snd');
function drawSnd(){ snd.innerHTML = Kit.SE.muted ? Kit.ICON.off : Kit.ICON.on; snd.setAttribute('aria-pressed', String(!Kit.SE.muted)); }
snd.addEventListener('click', () => { Kit.SE.setMuted(!Kit.SE.muted); drawSnd(); Kit.SE.play('pop'); });
drawSnd();
render();
window.addEventListener('pageshow', render); // 戻るボタンで戻ったときにセーブ表示を更新
})();
</script>
</body>
</html>
